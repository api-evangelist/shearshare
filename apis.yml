name: ShearShare
description: ShearShare is a B2B2C marketplace that lets salon and barbershop owners rent out unused
  chairs, booths, and suites to licensed beauty and barbering professionals on a flexible, on-demand
  basis — space-as-a-service for the hair, beauty, and grooming industry. Through its mobile app and web
  platform, independent stylists, barbers, and cosmetologists discover and book professional space by the
  day, while shop owners monetize idle capacity. Founded in 2015 by Dr. Tye Caldwell and Courtney Caldwell
  and headquartered in McKinney, Texas, the company has been featured on ABC's Shark Tank and is backed by
  500 Global among other investors.
